name: field-from-above
version: 0.1.0
description: Ask Hermes for a dated Sentinel-2 NDRE view and terrain context for a Polish parcel or any point.
requires_hermes: ">=0.21.5"
provides_tools:
  - field_from_above_parcel
  - field_from_above_point
provides_hooks: []
python_dependencies:
  - "numpy>=2.0,<3"
  - "shapely>=2.0,<3"
  - "pyproj>=3.6,<4"
  - "rasterio>=1.3,<2"
  - "matplotlib>=3.8,<4"
  - "pillow>=10,<13"
